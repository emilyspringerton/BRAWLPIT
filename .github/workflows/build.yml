name: Build BRAWLPIT

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- LINUX BUILD & SPIRIT STICK ---
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev build-essential zip

    - name: Build Client
      run: gcc -std=c99 -o brawlpit apps/lobby/src/main.c -lSDL2 -lGL -lGLU -lm

    - name: Build Server
      run: gcc -std=c99 -o brawlpit_server apps/server/src/main.c -lm
    
    # --- CREATE SPIRIT STICK (Source Code Zip) ---
    - name: Create Construct (Spirit Stick)
      run: |
        # Zip everything except .git folder
        zip -r BRAWLPIT_CONSTRUCT.zip . -x "*.git*"

    - name: Upload Linux Artifacts & Stick
      uses: actions/upload-artifact@v4
      with:
        name: brawlpit-linux-construct
        path: |
          brawlpit
          brawlpit_server
          BRAWLPIT_CONSTRUCT.zip

  # --- WINDOWS BUILD (With DLLs) ---
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
    
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          git base-devel mingw-w64-x86_64-toolchain mingw-w64-x86_64-SDL2

    - name: Build Client (Windows)
      # Link ws2_32 for sockets, copy DLLs later
      run: |
        gcc -std=c99 -o brawlpit.exe apps/lobby/src/main.c -lSDL2 -lSDL2main -lopengl32 -lglu32 -lm -lws2_32

    - name: Build Server (Windows)
      run: |
        gcc -std=c99 -o brawlpit_server.exe apps/server/src/main.c -lws2_32

    - name: Bundle Artifacts
      run: |
        mkdir release
        cp brawlpit.exe release/
        cp brawlpit_server.exe release/
        # Copy SDL2.dll from MinGW bin to release folder so it works out-of-box
        cp /mingw64/bin/SDL2.dll release/

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: brawlpit-windows
        path: release/
