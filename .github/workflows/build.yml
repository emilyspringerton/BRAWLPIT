name: Brawlpit Factory

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: 🏗️ Build, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # --- 1. SETUP ---
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip build-essential python3
          wget https://www.libsdl.org/release/SDL2-devel-2.28.5-mingw.tar.gz
          tar xzf SDL2-devel-2.28.5-mingw.tar.gz
          mv SDL2-2.28.5/x86_64-w64-mingw32 ./sdl2_mingw

      # --- 2. TEST ---
      - name: Run Physics Tests
        run: |
          gcc -std=c99 -O2 tests/test_physics.c -o test_physics -lm
          ./test_physics

      # --- 3. BUILD ARTIFACTS ---
      - name: Build Windows Client
        run: |
          echo "🔨 Building Brawlpit.exe..."
          x86_64-w64-mingw32-gcc apps/lobby/src/main.c -o Brawlpit.exe \
            -O2 -static-libgcc \
            -I./sdl2_mingw/include -Ipackages/common -Ipackages/simulation \
            -L./sdl2_mingw/lib \
            -lmingw32 -lSDL2main -lSDL2 -lopengl32 -lglu32 -lws2_32 -lwinmm -lgdi32 -lm

      - name: Build Linux Server
        run: |
          if [ -f apps/server/src/main.c ]; then
            echo "🔨 Building BrawlpitServer_Linux..."
            gcc apps/server/src/main.c -o BrawlpitServer_Linux \
              -O2 -static -Ipackages/common -Ipackages/simulation -lm
          else
            echo "⚠️ Server source not found."
            touch BrawlpitServer_Linux
          fi

      # --- 4. GENERATE CONSTRUCT ---
      - name: Generate Source Construct
        run: |
          echo "BRAWLPIT BUILD ${{ github.run_number }} CONSTRUCT" > BRAWLPIT_CONSTRUCT.txt
          FILES="packages/common/protocol.h packages/common/physics.h packages/common/text.h packages/simulation/local_game.h apps/lobby/src/main.c apps/server/src/main.c"
          for file in $FILES; do
            if [ -f "$file" ]; then
              echo "--- FILE START: $file ---" >> BRAWLPIT_CONSTRUCT.txt
              cat "$file" >> BRAWLPIT_CONSTRUCT.txt
              echo "--- FILE END: $file ---" >> BRAWLPIT_CONSTRUCT.txt
            fi
          done

      # --- 5. PACKAGE ---
      - name: Bundle Artifacts
        run: |
          mkdir Brawlpit_Client
          cp Brawlpit.exe Brawlpit_Client/
          cp sdl2_mingw/bin/SDL2.dll Brawlpit_Client/
          cp BRAWLPIT_CONSTRUCT.txt Brawlpit_Client/
          echo "start Brawlpit.exe" > Brawlpit_Client/PLAY.bat
          zip -r Brawlpit_Windows.zip Brawlpit_Client

          mv BrawlpitServer_Linux Brawlpit_Server_Linux

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Brawlpit_Builds
          path: |
            Brawlpit_Windows.zip
            Brawlpit_Server_Linux
            BRAWLPIT_CONSTRUCT.txt
